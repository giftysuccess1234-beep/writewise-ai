<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WriteWise AI</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 20px;
  color: #222;
}
.container {
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}
h1 { color: #2563eb; text-align: center; }
.subtitle { text-align: center; color: #666; }
textarea {
  width: 100%;
  height: 180px;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  resize: vertical;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
.results { display: none; margin-top: 25px; }
.score {
  background: #eef6ff;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}
.score strong {
  display: block;
  font-size: 42px;
  color: #2563eb;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
}
.stat {
  background: #f4f7fb;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
}
.stat strong {
  display: block;
  font-size: 22px;
  margin-top: 5px;
}
.feedback {
  background: #f8fafc;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
}
li { margin-bottom: 10px; }
footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>
<body>
<div class="container">
<h1>WriteWise AI</h1>
<p class="subtitle">Your Writing Quality Evaluation Assistant</p>

<textarea id="writingInput" placeholder="Paste your writing here to evaluate its quality..."></textarea>
<button onclick="evaluateWriting()">Evaluate My Writing</button>

<div class="results" id="results">
<div class="score">
<h3>Writing Quality Score</h3>
<strong id="qualityScore">0/100</strong>
<span id="scoreMessage"></span>
</div>

<div class="stats">
<div class="stat">Word Count<strong id="wordCount">0</strong></div>
<div class="stat">Sentence Count<strong id="sentenceCount">0</strong></div>
<div class="stat">Character Count<strong id="characterCount">0</strong></div>
<div class="stat">Average Words/Sentence<strong id="averageWords">0</strong></div>
</div>

<div class="feedback">
<h3>Issues Found</h3>
<ul id="issues"></ul>
</div>

<div class="feedback">
<h3>Suggestions for Improvement</h3>
<ul id="suggestions"></ul>
</div>
</div>

<footer>WriteWise AI — Initial Development</footer>
</div>

<script>
function evaluateWriting() {
  const text = document.getElementById("writingInput").value.trim();

  if (!text) {
    alert("Please enter some writing first.");
    return;
  }

  const words = text.split(/\s+/).filter(Boolean);
  const sentences = text.split(/[.!?]+/).filter(s => s.trim());
  const wordCount = words.length;
  const sentenceCount = sentences.length;
  const average = wordCount / sentenceCount;

  let score = 100;
  let issues = [];
  let suggestions
